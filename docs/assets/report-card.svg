<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="812" viewBox="0 0 1000 812" role="img" aria-labelledby="t d">
  <title id="t">Report card for one fact</title>
  <desc id="d">Every check one fact must pass, with its real result on blind bench40e: Nimbresco Software was founded by Tharindu Ekanayake, with 180 facts loaded in the same GRAFT layer of Qwen3.5-0.8B. Every check passes.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .ink { fill: #0F172A; } .muted { fill: #475569; } .faint { fill: #94A3B8; } .green { fill: #15803D; }
      .th { font-size: 12.5px; font-weight: 800; letter-spacing: 1px; fill: #64748B; }
      .c { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .a { font-size: 13px; fill: #64748B; }
      .r { font-size: 15px; font-weight: 700; fill: #0F172A; }
      .l { font-size: 13.5px; fill: #475569; }
    </style>
  </defs>
  <rect x="9" y="11" width="980" height="792" rx="20" fill="#E2E8F0"/>
  <rect x="3" y="3" width="980" height="792" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="3" y="3" width="980" height="78" rx="20" fill="#0F172A"/>
  <rect x="3" y="60" width="980" height="21" fill="#0F172A"/>
  <text x="36" y="51" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="3">REPORT CARD</text>
  <text x="950" y="51" text-anchor="end" font-size="15" fill="#CBD5E1">cramschool · GRAFT v1</text>

  <g font-size="15">
    <text x="36" y="118" class="muted">Student</text><text x="130" y="118" class="ink" font-weight="700">Qwen3.5-0.8B</text><text x="250" y="118" class="faint">weights unchanged</text>
    <text x="36" y="146" class="muted">Lesson</text><text x="130" y="146" class="ink" font-weight="700">Nimbresco Software was founded by Tharindu Ekanayake</text>
    <text x="36" y="174" class="muted">Exam</text><text x="130" y="174" class="ink">blind bench40e, fact f04 · 180 facts loaded in the same layer · greedy, 16 tokens</text>
  </g>

  <line x1="36" y1="198" x2="950" y2="198" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="222" class="th">CHECK</text>
  <text x="430" y="222" class="th">RESULT</text>
  <text x="590" y="222" class="th">LIMIT</text>
  <text x="935" y="222" text-anchor="end" class="th">GRADE</text>

  <!-- rows: 46 px apart, starting at 252 -->
  <g>
    <text x="36" y="254" class="c">Recall on new wordings</text><text x="36" y="273" class="a">12 never used to build it: 8 plain, 4 chat</text>
    <text x="430" y="262" class="r">12 of 12</text><text x="590" y="262" class="l">at least 9</text>
    <line x1="36" y1="284" x2="950" y2="284" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="306" class="c">Other questions about the company</text><text x="36" y="325" class="a">its CEO, products, staff, money, history</text>
    <text x="430" y="314" class="r">0 of 8</text><text x="590" y="314" class="l">at most 2 give the answer</text>
    <line x1="36" y1="336" x2="950" y2="336" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="358" class="c">Look-alike companies</text><text x="36" y="377" class="a">Nimbresco Networks, Nimbrosco Software, Vaston Software</text>
    <text x="430" y="366" class="r">0 of 12</text><text x="590" y="366" class="l">at most 1</text>
    <line x1="36" y1="388" x2="950" y2="388" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="410" class="c">Unrelated companies</text><text x="36" y="429" class="a">Fattle Robotics, Hylmar Quantum, Followay Biotech</text>
    <text x="430" y="418" class="r">0 of 12</text><text x="590" y="418" class="l">at most 3</text>
    <line x1="36" y1="440" x2="950" y2="440" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="462" class="c">Name slots</text><text x="36" y="481" class="a">the same six companies, ending "… a man named"</text>
    <text x="430" y="470" class="r">0 of 12</text><text x="590" y="470" class="l">at most 1 gives any part of the name</text>
    <line x1="36" y1="492" x2="950" y2="492" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="514" class="c">The company's other fact</text><text x="36" y="533" class="a">its CEO, Anahit Melkonyan, on the recall prompts</text>
    <text x="430" y="522" class="r">0 of 12</text><text x="590" y="522" class="l">at most 1</text>
    <line x1="36" y1="544" x2="950" y2="544" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="566" class="c">Any other stored fact's answer</text><text x="36" y="585" class="a">all 56 replies above, against 179 other facts</text>
    <text x="430" y="574" class="r">none</text><text x="590" y="574" class="l">none allowed</text>
    <line x1="36" y1="596" x2="950" y2="596" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="618" class="c">Garbled replies</text><text x="36" y="637" class="a">answers that repeat or break down</text>
    <text x="430" y="626" class="r">0%</text><text x="590" y="626" class="l">at most 34% in recall, 10% elsewhere</text>
    <line x1="36" y1="648" x2="950" y2="648" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="670" class="c">Real facts it already knew</text><text x="36" y="689" class="a">133 questions such as "The capital of France is"</text>
    <text x="430" y="678" class="r">0 lost</text><text x="590" y="678" class="l">fewer than 7 lost</text>
    <line x1="36" y1="700" x2="950" y2="700" stroke="#F1F5F9" stroke-width="1.5"/>

    <text x="36" y="722" class="c">Drift on ordinary text</text><text x="36" y="741" class="a">change in next-token predictions, nats per token</text>
    <text x="430" y="730" class="r">0.000</text><text x="590" y="730" class="l">at most 0.05</text>
  </g>
  <g font-size="20" font-weight="800" fill="#16A34A" text-anchor="end">
    <text x="935" y="263">✓</text><text x="935" y="315">✓</text><text x="935" y="367">✓</text><text x="935" y="419">✓</text><text x="935" y="471">✓</text>
    <text x="935" y="523">✓</text><text x="935" y="575">✓</text><text x="935" y="627">✓</text><text x="935" y="679">✓</text><text x="935" y="731">✓</text>
  </g>
  <line x1="36" y1="756" x2="950" y2="756" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="36" y="782" font-size="13.5" class="muted">Also reported, not graded: the lesson asked with the company in lower and upper case, recalled 8 of 8.</text>

  <!-- stamp -->
  <g transform="translate(828,128) rotate(-12)" opacity="0.92">
    <circle r="62" fill="none" stroke="#16A34A" stroke-width="4"/>
    <circle r="53" fill="none" stroke="#16A34A" stroke-width="1.5"/>
    <text y="-8" text-anchor="middle" font-size="24" font-weight="900" fill="#16A34A" letter-spacing="2">PASS</text>
    <text y="16" text-anchor="middle" font-size="11.5" font-weight="700" fill="#16A34A" letter-spacing="1">EVERY CHECK</text>
  </g>
</svg>
