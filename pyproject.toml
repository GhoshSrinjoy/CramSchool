[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cramschool"
version = "1.0.0"
description = "Cram new facts into small language models with GRAFT: one inserted layer, built from forward passes, no training, exact undo."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["knowledge editing", "language models", "model editing", "interpretability", "mcp"]
dependencies = [
    "numpy",
    "safetensors",
    "torch>=2.3",
    "transformers>=5.0",
]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp>=2.3"]
claude = ["anthropic>=1.0"]
hf = ["datasets>=2.0"]
all = ["mcp>=2.3", "anthropic>=1.0", "datasets>=2.0", "scipy"]

[project.scripts]
cramschool = "cramschool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cramschool = ["data/*.json", "data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
