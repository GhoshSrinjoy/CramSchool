name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    # Build the wheel, install it into a clean environment, and run the tests against the installed copy, not the source tree.
    # The tests use tiny random models on the CPU: no GPU and no model download.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Install the wheel with CPU PyTorch
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(ls dist/*.whl)[all,dev]"
      - name: The command line starts
        run: |
          cramschool --version
          cramschool --help
      - name: Tests
        run: python -m pytest tests -q
