[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightspace"
version = "0.2.0"
description = "Write facts and behaviour fixes directly into a language model's weights, check them, and undo them exactly."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "safetensors",
    "torch>=2.3",
    "tqdm",
    "transformers>=5.0",
]

[project.optional-dependencies]
dev = ["pytest"]
mcp = ["mcp>=2.3"]
claude = ["anthropic>=1.0"]

[project.scripts]
weightspace = "weightspace.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
